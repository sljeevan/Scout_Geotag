workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "com.flss.scout"
        APP_STORE_APPLE_ID: "6772134481"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      groups:
        - Scout_geotag

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Configure Google Maps for iOS
        script: |
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "GOOGLE_MAPS_API_KEY is required in the Scout_geotag Codemagic group."
            exit 1
          fi
          printf '#include "Generated.xcconfig"\nGOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" > ios/Flutter/Debug.xcconfig
          printf '#include "Generated.xcconfig"\nGOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" > ios/Flutter/Release.xcconfig

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
